[package]
name = "lulu-serial-port"
version = "0.1.0"
edition = "2021"
description = "Async serial port manager with lulu-logs integration for automated testing"
license = "Apache-2.0"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }

# Async serial port (wraps the `serialport` crate with tokio AsyncRead/AsyncWrite)
tokio-serial = "5.4.4"

# Serial port enumeration (used to discover ports by USB VID/PID and for the list binary)
serialport = "4"

# lulu-logs MQTT client
lulu-logs = { git = "https://github.com/XdoctorwhoZ/lulu-logs-rust", tag = "0.1.0" }

# Error derivation
thiserror = "1"

# Trace instrumentation
tracing = "0.1"

[[bin]]
name = "serial-port-list"
path = "src/bin/serial_port_list.rs"
